<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Doctor Login | CMC</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-900 flex items-center justify-center h-screen px-4">
    <div class="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-md">
        <div class="text-center mb-8">
            <div class="bg-blue-100 text-blue-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto text-2xl mb-4">⚕</div>
            <h2 class="text-2xl font-extrabold text-slate-800">Doctor Dashboard</h2>
            <p class="text-slate-400 text-sm">Please enter your medical license credentials</p>
        </div>
        <form id="docLogin" class="space-y-4">
            <input type="text" placeholder="License ID (e.g. DOC-123)" required class="w-full border p-4 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
            <input type="password" placeholder="Password" required class="w-full border p-4 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
            <button type="submit" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold hover:bg-blue-700 transition">Authorize Access</button>
        </form>
        <div class="mt-6 text-center"><a href="index.html" class="text-slate-400 hover:text-blue-600 text-sm">Cancel and Return</a></div>
    </div>
    <script>
        document.getElementById('docLogin').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Doctor Login successful! Redirecting to dashboard...');
        });
    </script>
</body>
</html>
