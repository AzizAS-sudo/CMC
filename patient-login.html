<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Patient Portal | CMC</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center h-screen px-4">
    <div class="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-md">
        <h2 class="text-2xl font-extrabold text-center mb-6 text-blue-800">MyHealth Patient Portal</h2>
        <form id="patLogin" class="space-y-4">
            <input type="email" placeholder="Email Address" required class="w-full border p-4 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
            <input type="password" placeholder="Password" required class="w-full border p-4 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
            <button type="submit" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold hover:bg-blue-700 transition">Sign In</button>
        </form>
        <div class="mt-6 text-center">
            <p class="text-slate-500 text-sm mb-2">New patient? <a href="#" class="text-blue-600 font-bold">Register here</a></p>
            <a href="index.html" class="text-slate-400 hover:underline text-sm">Back to Home</a>
        </div>
    </div>
    <script>
        document.getElementById('patLogin').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Welcome back! Loading your medical records...');
        });
    </script>
</body>
</html>
